<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E4743">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ETAR">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controlo ETAR – Europastry</title>
<style>
:root{--red:#EFD19F;--on:#2E4743;--ac:#EFD19F;--bg:#3E5D58;--card:#4D6A65;--tx:#fff;--mu:#C9D6D2;--bd:#628079;--ok:#C4EBCE;--okb:#356B58;--wn:#FFC2B8;--wnb:#7D4038;color-scheme:dark;accent-color:#EFD19F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#2E4743;border-bottom:3px solid var(--ac);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:28px;width:auto;display:block}
header h1{margin:0;font-size:20px;font-weight:700;font-family:Georgia,'Times New Roman',serif}header h1 em{color:var(--ac)}header p{margin:2px 0 0;font-size:12px;opacity:.7}
.hd{border-left:1px solid #ffffff40;padding-left:14px}
main{max-width:760px;margin:0 auto;padding:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
input[type=date],input[type=number],input[type=email],select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tab{flex:none;padding:8px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--red);color:var(--on);border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:minmax(140px,1fr) 100px 84px 302px;gap:10px 12px;align-items:center}
.card .f{justify-self:start}
.nm{font-weight:600;font-size:14px}.nm small{display:block;font-weight:400;color:var(--mu);font-size:11px;margin-top:2px}
.f{font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--bd);color:var(--mu)}
.s-ok{background:var(--okb);color:var(--ok)}.s-wn{background:var(--wnb);color:var(--wn)}
.in{display:grid;grid-template-columns:90px 52px 90px 52px;gap:6px;align-items:center}.in input{width:100%;min-width:0}.in span{font-size:12px;color:var(--mu);text-align:right}
@media(max-width:640px){.card{grid-template-columns:100px 84px 1fr}.nm{grid-column:1/-1}.in{grid-column:1/-1;grid-template-columns:1fr 46px 1fr 46px}}
button.b{font:inherit;font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--red);background:var(--red);color:var(--on);font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ac);border-color:var(--ac)}
label.t{font-size:13px;display:flex;gap:6px;align-items:center}
.wrap{overflow-x:auto}table{border-collapse:collapse;font-size:12px;width:100%}th{background:var(--red);color:var(--on);position:sticky;top:0}
th,td{padding:6px 8px;border:1px solid var(--bd);white-space:nowrap;text-align:center}
textarea{width:100%;height:120px;font:12px monospace;margin-top:8px}
.panel{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.pr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tg details{margin:4px 0}.tg summary{cursor:pointer;font-weight:600;font-size:13px}.tg label{margin:3px 0 3px 14px}
svg .gl{stroke:var(--bd)}svg .ln{fill:none;stroke:var(--ac);stroke-width:2}svg .dt{fill:var(--ac)}svg text{fill:var(--mu);font-size:10px}
.nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:12px}
.nav button{flex:1;font:inherit;font-size:14px;padding:10px 8px;border:0;border-radius:9px;background:transparent;color:var(--tx);cursor:pointer}
.nav button#rg{flex:1.6;font-size:15px;font-weight:700}
.nav button.on{background:var(--red);color:var(--on)}
.ft{margin-top:22px;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:10px}
.ft .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ft .row span{flex:1 1 200px}
button.sm{font-size:12px;padding:5px 10px}
.cr{background:#2E4743;border-top:3px solid #EFD19F;color:#fff;text-align:center;font-size:12px;line-height:1.5;padding:14px 16px;margin-top:20px}
.er{display:grid;grid-template-columns:1fr 110px 28px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}
.er input{width:100%;min-width:0}.er .u{text-align:right;color:var(--mu);font-size:12px}
td:first-child{text-align:left}tr.tot td{font-weight:700;background:var(--bg)}
.leg{font-size:11px;color:var(--mu);margin-top:10px}
.savebar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;justify-content:flex-end;background:var(--bg);border-top:1px solid var(--bd);padding:10px 0;margin-top:8px}
.savebar span{font-size:12px;color:var(--mu);flex:1}.savebar .pend{color:var(--wn);font-weight:600}.savebar .done{color:var(--ok);font-weight:600}
button.b:disabled{opacity:.45;cursor:default}
</style>
</head>

   const kk=k(pt,r[0],i);
   inp.value=((dr[d]||{})[kk]!==undefined?dr[d][kk]:(db[d]||{})[kk])??'';
   inp.oninput=()=>{dr[d]=dr[d]||{};dr[d][kk]=inp.value;dirty()};
   w.appendChild(inp);const u=document.createElement('span');u.textContent=s[1];w.appendChild(u)
  });
  c.appendChild(w);v.appendChild(c);
 });
 if(!v.children.length)v.innerHTML='<p class="leg">Nada em falta neste ponto. ✔</p>';
}
function renderHist(v){
 const rows=P.filter(r=>r[3][pt]);
 const cols=[];rows.forEach(r=>r[2].forEach((s,i)=>cols.push([r,i,r[1]+(s[0]?' '+s[0]:'')])));
 const ds=Object.keys(db).sort().reverse();
 let h='<div class="wrap"><table><tr><th>Data</th>'+cols.map(c=>'<th>'+c[2]+'</th>').join('')+'</tr>';
 ds.forEach(d=>{if(cols.some(c=>db[d][k(pt,c[0][0],c[1])]!==undefined))h+='<tr><td>'+d.split('-').reverse().join('/')+'</td>'+cols.map(c=>'<td>'+(db[d][k(pt,c[0][0],c[1])]??'')+'</td>').join('')+'</tr>'});
 v.innerHTML=h+'</table></div>'+(ds.length?'':'<p class="leg">Ainda sem registos.</p>');
}
function dirty(){const n=Object.values(dr).reduce((a,o)=>a+Object.keys(o).length,0);$('sv').disabled=!n;const m=$('msg');if(n){m.className='pend';m.textContent='Alterações por guardar'}}
function commit(){
 Object.keys(dr).forEach(d=>{db[d]=db[d]||{};Object.entries(dr[d]).forEach(([key,val])=>{if(val==='')delete db[d][key];else db[d][key]=val});if(!Object.keys(db[d]).length)delete db[d]});
 dr={};save();render();dirty();
 const m=$('msg');m.className='done';m.textContent='✔ Guardado às '+new Date().toTimeString().slice(0,5);
}
$('sv').onclick=commit;
const tagsOf=p=>p==='cons'?RE.map(r=>({k:k('cons',r[0],0),n:r[1]+' (kg)'})):P.filter(r=>r[3][p]).flatMap(r=>r[2].map((s,i)=>({k:k(p,r[0],i),n:r[1]+(s[0]?' '+s[0]:'')+(s[1]?' ('+s[1]+')':'')})));
const GP=[...PTS,['cons','Consumos']];
const today=()=>new Date().toLocaleDateString('sv-SE');
const addD=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fd=s=>s.slice(8)+'/'+s.slice(5,7);
const nf=v=>v.toFixed(2).replace(/\.?0+$/,'').replace('.',',');
function range(){const t=today();if(G.per==='hoje')return[t,t];if(G.per==='sem')return[addD(t,-6),t];if(G.per==='mes')return[addD(t,-29),t];const a=G.from||addD(t,-6),b=G.to||t;return a<=b?[a,b]:[b,a]}
function chart(t,pn,a,b){
 const pts=Object.keys(db).filter(d=>d>=a&&d<=b&&db[d][t.k]!==undefined&&db[d][t.k]!=='').sort().map(d=>[d,+db[d][t.k]]);
 const hd=`<div class="panel"><b>${t.n}</b> <span class="f">${pn}</span>`;
 if(!pts.length)return hd+'<div class="leg">Sem registos no período.</div></div>';
 const ys=pts.map(p=>p[1]),lo=Math.min(...ys),hi=Math.max(...ys),av=ys.reduce((x,y)=>x+y,0)/ys.length;
 const pad=(hi-lo)||Math.abs(hi)||1,y0=lo-pad*.1,y1=hi+pad*.1,W=600,H=170,L=46,R=12,T=10,B=24;
 const sp=a===b?1:days(a,b),X=d=>a===b?(L+W-R)/2:L+days(a,d)/sp*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
 for(let i=0;i<4;i++){const v=y0+(y1-y0)*i/3,y=Y(v);s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${nf(v)}</text>`}
 s+=`<text x="${L}" y="${H-6}">${fd(a)}</text>`+(a!==b?`<text x="${W-R}" y="${H-6}" text-anchor="end">${fd(b)}</text>`:'');
 s+=`<polyline class="ln" points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`;
 pts.forEach(p=>s+=`<circle class="dt" cx="${X(p[0])}" cy="${Y(p[1])}" r="3.5"><title>${fd(p[0])}: ${nf(p[1])}</title></circle>`);
 return hd+`<div class="leg">${pts.length} registos · mín ${nf(lo)} · média ${nf(av)} · máx ${nf(hi)}</div>`+s+'</svg></div>';}
function drawCharts(){const [a,b]=range();let h='';
 GP.forEach(([p,pn])=>tagsOf(p).forEach(t=>{if(G.sel.has(t.k))h+=chart(t,pn,a,b)}));
 $('gch').innerHTML=h||'<p class="leg">Seleciona uma ou mais tags para ver os gráficos.</p>';}
function renderGraf(v){
 const [a,b]=range();
 let h='<div class="panel"><div class="pr">'+[['hoje','Hoje'],['sem','Última semana'],['mes','Último mês'],['per','Personalizado']].map(([id,n])=>`<button class="tab${G.per===id?' on':''}" data-p="${id}">${n}</button>`).join('')+'</div>';
 if(G.per==='per')h+=`<div class="pr"><input type="date" id="gf" value="${a}"><span>até</span><input type="date" id="gt" value="${b}"></div>`;
 h+='<div class="tg">'+GP.map(([p,pn])=>`<details${tagsOf(p).some(t=>G.sel.has(t.k))?' open':''}><summary>${pn}</summary>`+tagsOf(p).map(t=>`<label class="t"><input type="checkbox" data-k="${t.k}"${G.sel.has(t.k)?' checked':''}> ${t.n}</label>`).join('')+'</details>').join('')+'</div><button class="b g" id="gc0" style="margin-top:8px">Limpar seleção</button></div><div id="gch"></div>';
 v.innerHTML=h;
 v.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{const[r1,r2]=range();if(x.dataset.p==='per'){G.from=G.from||r1;G.to=G.to||r2}G.per=x.dataset.p;render()});
 v.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{c.checked?G.sel.add(c.dataset.k):G.sel.delete(c.dataset.k);drawCharts()});
 if($('gf')){$('gf').onchange=e=>{G.from=e.target.value;drawCharts()};$('gt').onchange=e=>{G.to=e.target.value;drawCharts()}}
 $('gc0').onclick=()=>{G.sel.clear();render()};
 drawCharts();}
const RE=[['pax','Cloreto Férrico',[40,90]],['fld','Floculante (DAF)',[3,8]],['flc','Floculante (Centrífuga)',[4,10]],['soda','Soda cáustica (50%)',[20,60]],['af','Anti-espuma',[1,4]]];
const mon=s=>addD(s,-((new Date(s+'T12:00:00Z').getUTCDay()+6)%7));
const sumR=(id,a,b)=>{let t=0,n=0;Object.keys(db).forEach(d=>{if(d>=a&&d<=b){const x=db[d][k('cons',id,0)];if(x!==undefined&&x!==''){t+=+x;n++}}});return n?t:null};
const tbl=(rows,tot)=>'<div class="wrap"><table><tr><th>Período</th>'+RE.map(r=>`<th>${r[1]}</th>`).join('')+'</tr>'+rows.map(([l,a,b],i)=>`<tr${tot&&i===rows.length-1?' class="tot"':''}><td>${l}</td>`+RE.map(r=>{const x=sumR(r[0],a,b);return `<td>${x===null?'–':nf(x)}</td>`}).join('')+'</tr>').join('')+'</table></div>';
function renderCons(v){
 const t=today();if(!C.date)C.date=t;
 let h='<div class="panel"><div class="pr">'+[['d','Diário'],['s','Semanal'],['m','Mensal']].map(([i,n])=>`<button class="tab${C.per===i?' on':''}" data-c="${i}">${n}</button>`).join('')+'</div>';
 if(C.per==='d'){
  h+=`<div class="pr"><input type="date" id="cd" value="${C.date}"><span class="leg" style="margin:0">Consumo do dia, em kg</span></div>`;
  RE.forEach(r=>{const kk=k('cons',r[0],0),x=(dr[C.date]||{})[kk]!==undefined?dr[C.date][kk]:(db[C.date]||{})[kk];
   h+=`<div class="er"><span>${r[1]}</span><input type="number" step="any" inputmode="decimal" data-r="${r[0]}" value="${x??''}"><span class="u">kg</span></div>`});
  h+='</div><div class="panel"><b>Últimos 7 dias</b> <span class="leg">(kg)</span>';
  const rows=[];for(let n=0;n<7;n++){const d=addD(t,-n);rows.push([fd(d),d,d])}
  rows.push(['Total 7 dias',addD(t,-6),t]);h+=tbl(rows,1)+'</div>';
 }else if(C.per==='s'){
  const rows=[];for(let i=0;i<8;i++){const a=addD(mon(t),-7*i),b=addD(a,6);rows.push([fd(a)+' – '+fd(b),a,b])}
  h+='<b>Últimas 8 semanas</b> <span class="leg">(kg, soma por semana)</span>'+tbl(rows)+'</div>';
 }else{
  const y=+t.slice(0,4),m=+t.slice(5,7)-1,rows=[];
  for(let i=0;i<6;i++){const a=new Date(Date.UTC(y,m-i,1)).toISOString().slice(0,10),b=new Date(Date.UTC(y,m-i+1,0)).toISOString().slice(0,10);rows.push([a.slice(5,7)+'/'+a.slice(0,4),a,b])}
  h+='<b>Últimos 6 meses</b> <span class="leg">(kg, soma por mês)</span>'+tbl(rows)+'</div>';
 }
 v.innerHTML=h;
 v.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{C.per=x.dataset.c;render()});
 if($('cd'))$('cd').onchange=e=>{C.date=e.target.value||t;render()};
 v.querySelectorAll('[data-r]').forEach(x=>x.oninput=()=>{const d=C.date,kk=k('cons',x.dataset.r,0);dr[d]=dr[d]||{};dr[d][kk]=x.value;dirty()});}
$('rg').onclick=()=>{hist=graf=cons=false;render()};
$('cn').onclick=()=>{cons=true;hist=graf=false;render()};
$('vh').onclick=()=>{hist=true;graf=cons=false;render()};
$('gv').onclick=()=>{graf=true;hist=cons=false;render()};

$('only').onchange=render;dt.onchange=render;
const expRange=()=>{const t=today(),v=$('xp').value;return v==='sem'?[addD(t,-6),t]:v==='mes'?[addD(t,-29),t]:['0000-00-00','9999-99-99']};
function buildCsv(){
 const [a,b]=expRange();let s='data;ponto;parametro;valor\n';
 Object.keys(db).sort().filter(d=>d>=a&&d<=b).forEach(d=>Object.entries(db[d]).forEach(([key,val])=>{
  const [p,id,i]=key.split('|');let pn,nm;if(p==='cons'){const e=RE.find(x=>x[0]===id);if(!e)return;pn='Consumos';nm=e[1]+' (kg)'}else{const r=P.find(x=>x[0]===id),pe=PTS.find(x=>x[0]===p);if(!r||!pe||!r[2][+i])return;const sb=r[2][+i][0];pn=pe[1];nm=r[1]+(sb?' '+sb:'')}
  s+=[d,pn,nm,String(val).replace('.',',')].join(';')+'\n'}));
 return s}
async function saveCsv(){
 const s=buildCsv();
 const fb=()=>{$('csv').innerHTML='<p class="leg">Não foi possível gravar o ficheiro neste dispositivo. Copia o texto abaixo:</p><textarea readonly></textarea>';const t=$('csv').lastChild;t.value=s;t.select();try{navigator.clipboard.writeText(s)}catch(e){}};
 let dl=null;try{dl=await claude.use('downloads')}catch(e){}
 if(!dl){try{const u=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'})),l=document.createElement('a');l.href=u;l.download='registos-etar-'+today()+'.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);$('csv').innerHTML='<p class="leg">✔ Ficheiro CSV gerado (ver pasta Transferências).</p>';return 'ok'}catch(e){fb();return 'fb'}}
 try{await dl.save({filename:'registos-etar-'+today()+'.csv',data:'\ufeff'+s});$('csv').innerHTML='<p class="leg">✔ Ficheiro enviado para gravação.</p>';return 'ok'}
 catch(e){if(e&&e.code==='declined')return 'no';fb();return 'fb'}}
$('ex').onclick=saveCsv;
$('em').onclick=async()=>{
 const [a,b]=expRange(),per=$('xp').value==='tudo'?'todos os registos':fd(a)+' a '+fd(b),to=$('to').value.trim();
 try{const file=new File(['\ufeff'+buildCsv()],'registos-etar-'+today()+'.csv',{type:'text/csv'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Registos ETAR e consumos – '+per,text:'Registos de parâmetros da ETAR e consumos ('+per+').'});return}}
 catch(e){if(e&&e.name==='AbortError')return}
 if(await saveCsv()==='no')return;
 try{localStorage.setItem(KEY0+'-to',to)}catch(e){}
 const sub='Registos ETAR e consumos – '+per;
 const body='Bom dia,\n\nSegue em anexo o ficheiro com os registos de parâmetros da ETAR e os consumos ('+per+').\n\n(Anexar o ficheiro registos-etar-'+today()+'.csv gravado há instantes.)\n\nCumprimentos';
 const url='mailto:'+to.replace(/[^\w.@,;+-]/g,'')+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);
 $('csv').insertAdjacentHTML('beforeend','<p class="leg">Passo seguinte: <a href="'+url+'" target="_top" style="color:var(--ac);font-weight:700">abrir rascunho de email</a> e anexar o ficheiro.</p>');
};
try{$('to').value=localStorage.getItem(KEY0+'-to')||''}catch(e){}
render();dirty();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
